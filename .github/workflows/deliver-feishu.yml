name: Refresh dashboard and deliver daily editions
on:
  schedule:
    - cron: '0 0,12 * * *'
    - cron: '17,47 * * * *'
  push:
    branches: [main]
    paths:
      - 'gpt-scheduled-task/**'
      - 'docs/index.html'
      - 'docs/app.js'
      - 'docs/style.css'
      - 'analysis/**'
      - '.github/workflows/deliver-feishu.yml'
  workflow_dispatch:
    inputs:
      send:
        description: 'Deliver due editions (false only refreshes the dashboard)'
        type: boolean
        default: true
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: finance-pipeline
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - name: Test before running
        run: |
          python gpt-scheduled-task/validate_config.py
          python -m unittest discover -s gpt-scheduled-task -p 'test_*.py'
      - name: Configure state commits
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
      - name: Collect and deliver
        id: briefing
        continue-on-error: true
        env:
          FEISHU_WEBHOOK_URL: ${{ secrets.FEISHU_WEBHOOK_URL }}
          SEND: ${{ github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.send) }}
        run: |
          if [ "$SEND" = "true" ]; then
            python gpt-scheduled-task/run_briefing.py --persist --send
          else
            python gpt-scheduled-task/run_briefing.py --persist
          fi
      - name: Prepare Pages
        uses: actions/configure-pages@v5
      - name: Upload dashboard
        uses: actions/upload-pages-artifact@v4
        with:
          path: docs
          retention-days: 1
      - name: Publish dashboard
        id: deployment
        uses: actions/deploy-pages@v4
      - name: Report delivery failure
        if: steps.briefing.outcome == 'failure'
        run: |
          echo 'Delivery or collection needs attention. Inspect docs/data/status.json and the Feishu group before retrying an uncertain send.' >> "$GITHUB_STEP_SUMMARY"
          exit 1
